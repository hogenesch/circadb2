name: Deploy CircaDB 2.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: circadb2/site/package-lock.json

      - name: Build public_data
        working-directory: circadb2
        run: python3 data_build/build_hughes_2009.py

      - name: Install site dependencies
        working-directory: circadb2/site
        run: npm ci

      - name: Set GitHub Pages base path
        run: echo "SITE_BASE=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_ENV"

      - name: Build Astro site
        working-directory: circadb2/site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: circadb2/site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
